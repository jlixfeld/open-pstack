name: Cursor pstack monitor

on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cursor-pstack-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install monitor dependencies
        working-directory: plugins/pstack/skills/poteto-mode/scripts
        run: bun install --frozen-lockfile
      - name: Fetch Cursor pstack default branch read-only
        run: git fetch --no-tags https://github.com/cursor/plugins.git +refs/heads/main:refs/remotes/cursor-upstream/main
      - name: Reconcile the one upstream-drift issue
        working-directory: plugins/pstack/skills/poteto-mode/scripts
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun upstream-pstack/pstack-upstream --upstream-ref cursor-upstream/main --repo "${{ github.repository }}"
